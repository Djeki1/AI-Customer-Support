[project]
name = "ai-customer-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[anthropic]>=2.64.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pydantic-evals>=2.64.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",   # Import errors
    "E7",   # Statement errors
    "E9",   # Syntax errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Modern Python syntax
]
